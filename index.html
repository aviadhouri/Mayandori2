function resize(){
  var dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W*dpr);
  canvas.height = Math.floor(H*dpr);
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  player.w = Math.max(125,Math.min(190,W*.26));
  player.h = player.w*.77;
  player.y = H-player.h-24;
  if(!player.x) player.x=(W-player.w)/2;
}
window.addEventListener("resize",resize);
resize();

function startGame(){
  score=0;
  scoreNode.innerHTML="0";
  envelopes=[];
  player.x=(W-player.w)/2;
  playing=true;
  last=performance.now();
  spawn=0;
  overlay.style.display="none";
  requestAnimationFrame(loop);
}
window.startGame=startGame;

function endGame(){
  playing=false;
  overlay.style.display="flex";
  overlay.querySelector("h1").innerHTML="The invitation got you! 😱";
  overlay.querySelector("p").innerHTML="You dodged <b>"+score+"</b> invitation"+(score===1?"":"s")+". Try again!";
  overlay.querySelector("button").innerHTML="PLAY AGAIN";
}

function addEnvelope(){
  envelopes.push({
    x:10+Math.random()*(W-90),
    y:-60,
    w:76,
    h:50,
    vy:220+Math.random()*100+score*5,
    rot:(Math.random()-.5)*.5
  });
}

function hit(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function drawBackground(){
  ctx.clearRect(0,0,W,H);

  // sun
  ctx.fillStyle="#ef4444";
  ctx.beginPath();
  ctx.arc(W*.82,H*.17,55,0,Math.PI*2);
  ctx.fill();

  // Fuji
  ctx.fillStyle="#778cab";
  ctx.beginPath();
  ctx.moveTo(W*.5,H*.28);
  ctx.lineTo(W*.82,H*.65);
  ctx.lineTo(W*.18,H*.65);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.moveTo(W*.5,H*.28);
  ctx.lineTo(W*.59,H*.385);
  ctx.lineTo(W*.55,H*.37);
  ctx.lineTo(W*.51,H*.42);
  ctx.lineTo(W*.47,H*.37);
  ctx.lineTo(W*.41,H*.39);
  ctx.closePath();
  ctx.fill();

  // Torii
  ctx.fillStyle="#a83232";
  ctx.fillRect(35,H*.48,12,H*.20);
  ctx.fillRect(105,H*.48,12,H*.20);
  ctx.fillRect(22,H*.48,108,10);
  ctx.fillRect(12,H*.455,128,10);
}

function drawPlayer(){
  ctx.save();
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(player.x,player.y,player.w,player.h,20);
  else ctx.rect(player.x,player.y,player.w,player.h);
  ctx.clip();

  if(couple.complete){
    var iw=couple.naturalWidth, ih=couple.naturalHeight;
    var scale=Math.max(player.w/iw,player.h/ih);
    var sw=player.w/scale, sh=player.h/scale;
    var sx=(iw-sw)/2, sy=Math.max(0,(ih-sh)*.28);
    ctx.drawImage(couple,sx,sy,sw,sh,player.x,player.y,player.w,player.h);
  } else {
    ctx.fillStyle="#eee";
    ctx.fillRect(player.x,player.y,player.w,player.h);
  }
  ctx.restore();

  ctx.strokeStyle="white";
  ctx.lineWidth=4;
  ctx.strokeRect(player.x,player.y,player.w,player.h);
}

function drawEnvelope(e){
  ctx.save();
  ctx.translate(e.x+e.w/2,e.y+e.h/2);
  ctx.rotate(e.rot);
  ctx.translate(-e.w/2,-e.h/2);

  ctx.fillStyle="#fffaf4";
  ctx.strokeStyle="#c9a98d";
  ctx.lineWidth=3;
  ctx.fillRect(0,0,e.w,e.h);
  ctx.strokeRect(0,0,e.w,e.h);

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(e.w/2,e.h*.58);
  ctx.lineTo(e.w,0);
  ctx.stroke();

  ctx.font="22px Arial";
  ctx.textAlign="center";
  ctx.fillText("💍",e.w/2,e.h*.78);
  ctx.restore();
}

function loop(t){
  if(!playing) return;
  var dt=Math.min(.035,(t-last)/1000);
  last=t;

  if(leftDown) player.x-=420*dt;
  if(rightDown) player.x+=420*dt;
  if(player.x<0) player.x=0;
  if(player.x+player.w>W) player.x=W-player.w;

  spawn+=dt;
  var interval=Math.max(.32,.82-score*.012);
  if(spawn>=interval){
    spawn=0;
    addEnvelope();
  }

  drawBackground();
  drawPlayer();

  for(var i=envelopes.length-1;i>=0;i--){
    var e=envelopes[i];
    e.y += e.vy*dt;
    drawEnvelope(e);

    var pHit={x:player.x+10,y:player.y+8,w:player.w-20,h:player.h-16};
    var eHit={x:e.x+5,y:e.y+4,w:e.w-10,h:e.h-8};
    if(hit(pHit,eHit)){
      endGame();
      return;
    }

    if(e.y>H+70){
      envelopes.splice(i,1);
      score++;
      scoreNode.innerHTML=score;
    }
  }

  requestAnimationFrame(loop);
}

document.addEventListener("keydown",function(e){
  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A") leftDown=true;
  if(e.key==="ArrowRight"||e.key==="d"||e.key==="D") rightDown=true;
});
document.addEventListener("keyup",function(e){
  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A") leftDown=false;
  if(e.key==="ArrowRight"||e.key==="d"||e.key==="D") rightDown=false;
});

function moveTouch(e){
  if(!playing) return;
  var touch=e.touches ? e.touches[0] : e;
  player.x=touch.clientX-player.w/2;
  if(player.x<0) player.x=0;
  if(player.x+player.w>W) player.x=W-player.w;
  if(e.cancelable) e.preventDefault();
}
canvas.addEventListener("touchstart",moveTouch,{passive:false});
canvas.addEventListener("touchmove",moveTouch,{passive:false});
canvas.addEventListener("mousedown",moveTouch);
canvas.addEventListener("mousemove",function(e){ if(e.buttons) moveTouch(e); });


// --- Procedural Japanese-inspired background music ---
// Uses a pentatonic scale and Web Audio, so no external audio file is needed.
var audioCtx = null;
var musicTimer = null;
var musicOn = true;
var musicBtn = document.getElementById("musicBtn");
var musicStep = 0;

// A simple Japanese-inspired pentatonic phrase (original, not copied from any song).
var melody = [
  69, 72, 74, 76, 74, 72, 69, 67,
  69, 72, 76, 74, 72, 69, 67, 64
];

function midiToFreq(n){
  return 440 * Math.pow(2, (n - 69) / 12);
}

function playTone(freq, when, duration, gainValue){
  if(!audioCtx) return;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();

  // Sine gives a softer, flute/koto-like feel.
  osc.type = "sine";
  osc.frequency.setValueAtTime(freq, when);

  gain.gain.setValueAtTime(0.0001, when);
  gain.gain.exponentialRampToValueAtTime(gainValue, when + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(when);
  osc.stop(when + duration + 0.03);
}

function scheduleMusic(){
  if(!audioCtx || !musicOn) return;

  var now = audioCtx.currentTime;
  var note = melody[musicStep % melody.length];

  // Main melody
  playTone(midiToFreq(note), now, 0.34, 0.055);

  // Soft lower drone every 4 notes
  if(musicStep % 4 === 0){
    playTone(midiToFreq(note - 12), now, 0.7, 0.018);
  }

  // Tiny bell-like accent every 8 notes
  if(musicStep % 8 === 0){
    playTone(midiToFreq(note + 12), now + 0.08, 0.18, 0.02);
  }

  musicStep++;
}

function startMusic(){
  if(!musicOn) return;

  if(!audioCtx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = new AC();
  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }

  if(musicTimer === null){
    scheduleMusic();
    musicTimer = setInterval(scheduleMusic, 420);
  }
}

function stopMusic(){
  if(musicTimer !== null){
    clearInterval(musicTimer);
    musicTimer = null;
  }
}

musicBtn.addEventListener("click", function(e){
  e.stopPropagation();
  musicOn = !musicOn;

  if(musicOn){
    musicBtn.textContent = "🎵 Music: On";
    startMusic();
  } else {
    musicBtn.textContent = "🔇 Music: Off";
    stopMusic();
  }
});

// iPhone Safari requires audio to begin from a user gesture.
// The Start button is such a gesture, so music begins when the game starts.
var originalStartGame = startGame;
startGame = function(){
  originalStartGame();
  startMusic();
};
window.startGame = startGame;

drawBackground();
drawPlayer();
</script>
